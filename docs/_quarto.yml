project:
  type: book
  output-dir: _site

engines: ['julia']
julia:
  project: "."

book:
  title: "OverpassAPI.jl"
  search:
    location: sidebar
    keyboard-shortcut:
      - "/"
  navbar:
    logo: assets/logo.svg
    logo-href: https://rallypoint1.com
    right:
      - icon: star
        href: https://github.com/RallypointOne/OverpassAPI.jl/stargazers
        text: "Star"
      - icon: github
        href: https://github.com/RallypointOne/OverpassAPI.jl
  chapters:
    - part: "Docs"
      chapters:
        - index.qmd
        - getting-started.qmd
        - overpass-ql.qmd
    - part: "API"
      chapters:
        - pages/api.qmd
    - part: "Reference"
      chapters:
        - changelog.qmd
        - pages/coverage.qmd

  page-footer:
    center: "Built on __BUILD_DATE__"

language:
  search-text-placeholder: "Search  (/)"

format:
  html:
    css: assets/styles.css
    number-sections: false
    theme:
      - flatly
      - assets/theme.scss
    include-after-body:
      - file: assets/_version-selector.html
